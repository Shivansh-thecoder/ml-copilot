[pytest]
# --import-mode=importlib avoids pytest's default "prepend" import mode,
# which (since both backend/mcp/__init__.py and backend/mcp/tests/__init__.py
# exist) would insert backend/ itself onto sys.path to import test modules
# as "mcp.tests.test_x" -- binding sys.modules["mcp"] to THIS package
# instead of the installed mcp SDK, breaking every `from mcp...` import in
# the same process. See backend/mcp/README.md's "naming-collision gotcha".
# importlib mode imports test files directly, with no such requirement.
addopts = --import-mode=importlib
