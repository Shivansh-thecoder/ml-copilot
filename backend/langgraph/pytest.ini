[pytest]
# --import-mode=importlib avoids pytest's default "prepend" import mode,
# which would insert backend/ itself onto sys.path (since both
# backend/langgraph/__init__.py and backend/langgraph/tests/__init__.py
# would otherwise exist) to import test modules as "langgraph.tests.test_x"
# -- binding sys.modules["langgraph"] to THIS package instead of the
# installed langgraph SDK, breaking every `from langgraph...` import in
# the same process. Same collision class as backend/mcp/pytest.ini;
# see backend/mcp/README.md's "naming-collision gotcha".
addopts = --import-mode=importlib
